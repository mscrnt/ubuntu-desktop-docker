name: build

on:
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [full, slim]
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - name: Build image (amd64, load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ubuntu-desktop:test-${{ matrix.variant }}
          build-args: |
            VARIANT=${{ matrix.variant }}
            INCLUDE_BROWSER=${{ matrix.variant == 'full' }}
            INCLUDE_MEDIA=${{ matrix.variant == 'full' }}
            INCLUDE_VSCODE=${{ matrix.variant == 'full' }}
            INCLUDE_DEVTOOLS=true
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Smoke test
        env:
          IMAGE: ubuntu-desktop:test-${{ matrix.variant }}
        run: ./tests/smoke.sh

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ubuntu-desktop:test-${{ matrix.variant }}
          severity: CRITICAL,HIGH
          exit-code: '0'   # report-only on PRs; release workflow enforces.
          ignore-unfixed: true
